[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core", "nanobind"]

[project]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
description = "python box2d bindings for box2d >= 3.2"
name = "pyb2d3"
requires-python = ">=3.12"
version = "0.11.1"

license = "MIT"
license-files = [
  "LICENSE",
  "extra_licenses/LICENSE_BOX2D",
  "extra_licenses/LICENSE_NANOBIND"
]

dependencies = [
  "numpy"
]

[tool.scikit-build]
cmake.source-dir = "."
sdist.exclude = [".pixi", ".github", "CLAUDE.md", "todos.md"]
wheel.packages = ["pyb2d3"]
# # Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.scikit-build.cmake.define]
Python_EXECUTABLE = "{sys.executable}"

[tool.pytest.ini_options]
addopts = "-s -vvvvv"
minversion = "6.2.5"
testpaths = [
    "tests"
]


[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F405", "E501"]

[tool.ruff]
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["tests", "emscripten_forge"]
line-length = 100

[tool.cibuildwheel]

# one stable ABI wheel (cp312-abi3) per platform, which cibuildwheel reuses and tests on
# 3.13 and 3.14
build = [
  "cp312-*",
  "cp313-*",
  "cp314-*",
]
skip = ["*t-*"]  # free-threaded builds: no stable ABI, not supported yet

# Necessary to see build output from the actual compilation
build-verbosity = 1

# run the tests against the built wheel (without the repo's verbose pytest options)
test-command = "pytest {project}/tests -q -o addopts="
test-requires = [
  "pytest",
  "pillow"
]

archs = ["auto64"]          # Only target 64 bit architectures

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
