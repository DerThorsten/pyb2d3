
name: emscripten-forge-pkg
on:
  push:
  pull_request:
jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: emscripten-forge
        run: pixi run emscripten
