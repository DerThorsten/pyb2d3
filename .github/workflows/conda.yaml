
name: conda
on:
  push:
  pull_request:
jobs:

  pip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: install
        run: pixi run install

      - name: test
        run: pixi run python -m pytest tests -v

  in-place:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1

      - name: build and test
        run: pixi run test -v
