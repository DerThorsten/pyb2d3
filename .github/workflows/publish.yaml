name: wheels

# Builds and tests the wheels + sdist on pull requests and on main.
# Publishing: push a tag `v<version>` matching the version in pyproject.toml,
#   git tag v0.12.0 && git push origin v0.12.0
# the upload job then publishes to PyPI (trusted publishing, environment "pypi").

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runs-on: ubuntu-latest
          - os: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - os: windows-amd64
            runs-on: windows-latest
          - os: macos-arm64
            runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # configuration (python versions, tests, ...) in [tool.cibuildwheel] of pyproject.toml
      - name: build and test wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # builds the sdist and then a wheel *from the sdist*: catches files missing in the sdist
      - name: build sdist (and a wheel from it)
        run: pipx run build --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: upload to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: check that the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the version ${version} in pyproject.toml"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: upload
        uses: pypa/gh-action-pypi-publish@release/v1
