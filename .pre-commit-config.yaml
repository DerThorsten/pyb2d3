# the generated docstrings (pixi run docstrings) must stay byte-identical to the generator output
exclude: ^(include/pyb2d3/generated/|src/module/pyb2d3/_docstrings\.py)
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  # keep in sync with ruff in pixi.toml (pixi run format)
  rev: v0.17.5
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

-  repo: https://github.com/pre-commit/mirrors-clang-format
   rev: v21.1.6
   hooks:
    -   id: clang-format
        exclude_types: [javascript, json, python, yaml]
